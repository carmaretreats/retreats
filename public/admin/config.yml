publish_mode: editorial_workflow
locale: de
backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

# Jede Datei entspricht einem Bereich der Seite, in der Reihenfolge von oben nach unten.
# Kursiv: Text zwischen *Sternchen*. Fett: Text zwischen **zwei Sternchen**.
collections:
  - name: "seite"
    label: "Website"
    editor: { preview: false }
    files:
      - name: "kopfbereich"
        label: "1 · Kopfbereich (ganz oben)"
        file: "src/content/seite/kopfbereich.json"
        format: "json"
        fields:
          - { label: "Überschrift", name: "titel", widget: "string", hint: 'Kursiv: Wörter in Sternchen setzen, z. B. Ankommen und \*Aufatmen.\*' }
          - { label: "Text darunter", name: "text", widget: "text" }
          - label: "Bild links"
            name: "bild1"
            widget: "object"
            fields: &bild
              - { label: "Bild", name: "src", widget: "image" }
              - { label: "Bildbeschreibung (für Google und Screenreader)", name: "alt", widget: "string", required: false }
              - { label: "Bildausschnitt", name: "ausschnitt", widget: "string", required: false, hint: "Optional. Verschiebt den sichtbaren Ausschnitt, z. B. \"center 30%\" (weiter oben) oder \"center 70%\" (weiter unten)." }
          - { label: "Bild rechts", name: "bild2", widget: "object", fields: *bild }

      - name: "stell-dir-vor"
        label: "2 · Stell dir vor"
        file: "src/content/seite/stell-dir-vor.json"
        format: "json"
        fields:
          - { label: "Kleine Überschrift", name: "label", widget: "string" }
          - { label: "Überschrift", name: "titel", widget: "string", hint: 'Kursiv: Wörter in Sternchen setzen, z. B. Ankommen und \*Aufatmen.\*' }
          - { label: "Absätze", name: "absaetze", widget: "list", field: { label: "Absatz", name: "absatz", widget: "text" } }
          - { label: "Bild", name: "bild", widget: "object", fields: *bild }
          - { label: "Button-Text", name: "button", widget: "string" }

      - name: "retreats"
        label: "3 · Retreats & Termine"
        file: "src/content/seite/retreats.json"
        format: "json"
        fields:
          - { label: "Kleine Überschrift", name: "label", widget: "string" }
          - label: "Retreats"
            name: "retreats"
            widget: "list"
            summary: "{{fields.datum}} · mit {{fields.lehrer}}"
            hint: "Erscheint in den Karten, bei Unterkunft & Preise und im Buchungsfenster."
            fields:
              - { label: "Titel der Karte", name: "titel", widget: "string" }
              - { label: "Datum", name: "datum", widget: "string", hint: "Z. B. \"23.–29. Januar 2027\". Monat und Jahr müssen zum Zimmer-Sheet passen, sonst stimmt die Verfügbarkeit nicht." }
              - { label: "Ort", name: "ort", widget: "string", hint: "Z. B. \"Hikkaduwa, Sri Lanka\"." }
              - { label: "Mit (Lehrer:innen)", name: "lehrer", widget: "string", required: false, hint: "Z. B. \"Carmen + Mareen\". Leer lassen, um es auszublenden." }
              - { label: "Beschreibung", name: "beschreibung", widget: "text" }
              - { label: "Bild der Karte", name: "bild", widget: "image" }
              - { label: "Bildform", name: "bildform", widget: "select", options: [{ label: "Eckig", value: "square" }, { label: "Rund", value: "circle" }], default: "square" }
              - { label: "Bild im Buchungsfenster", name: "buchungsbild", widget: "image", required: false, hint: "Optional. Ohne eigenes Bild wird das Kartenbild genommen." }
          - label: "Karte \"Weitere Retreats\""
            name: "weitere"
            widget: "object"
            fields:
              - { label: "Anzeigen", name: "anzeigen", widget: "boolean", default: true }
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Zeile unter dem Titel", name: "datum", widget: "string" }
              - { label: "Beschreibung", name: "beschreibung", widget: "text" }
              - { label: "Bild", name: "bild", widget: "image" }
              - { label: "Bildform", name: "bildform", widget: "select", options: [{ label: "Eckig", value: "square" }, { label: "Rund", value: "circle" }], default: "square" }
              - { label: "Button-Text (öffnet die Newsletter-Anmeldung)", name: "button", widget: "string" }

      - name: "highlights"
        label: "4 · Was dich erwartet"
        file: "src/content/seite/highlights.json"
        format: "json"
        fields:
          - { label: "Kleine Überschrift", name: "label", widget: "string" }
          - { label: "Überschrift", name: "titel", widget: "string", hint: 'Kursiv: Wörter in Sternchen setzen, z. B. Ankommen und \*Aufatmen.\*' }
          - label: "Punkte"
            name: "punkte"
            widget: "list"
            summary: "{{fields.titel}}"
            fields:
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "Bild oben", name: "bild1", widget: "object", fields: *bild }
          - { label: "Bild unten", name: "bild2", widget: "object", fields: *bild }

      - name: "retreat-infos"
        label: "5 · Retreat-Infos (terrakotta Bereich)"
        file: "src/content/seite/retreat-infos.json"
        format: "json"
        fields:
          - { label: "Kleine Überschrift", name: "label", widget: "string" }
          - { label: "Überschrift", name: "titel", widget: "string", hint: 'Kursiv: Wörter in Sternchen setzen, z. B. Ankommen und \*Aufatmen.\*' }
          - { label: "Text", name: "text", widget: "text", hint: "Jede neue Zeile wird ein eigener Absatz." }
          - { label: "Bild (Desktop)", name: "bild", widget: "object", fields: *bild }
          - label: "Zahlen"
            name: "fakten"
            widget: "list"
            summary: "{{fields.zahl}} {{fields.text}}"
            min: 3
            max: 3
            fields:
              - { label: "Zahl", name: "zahl", widget: "string" }
              - { label: "Text", name: "text", widget: "string" }

      - name: "tagesablauf"
        label: "6 · Ein Tag bei CARMA"
        file: "src/content/seite/tagesablauf.json"
        format: "json"
        fields:
          - { label: "Kleine Überschrift", name: "label", widget: "string" }
          - { label: "Überschrift", name: "titel", widget: "string", hint: 'Kursiv: Wörter in Sternchen setzen, z. B. Ankommen und \*Aufatmen.\*' }
          - label: "Ablauf"
            name: "ablauf"
            widget: "list"
            summary: "{{fields.zeit}} · {{fields.titel}}"
            fields:
              - { label: "Uhrzeit", name: "zeit", widget: "string" }
              - { label: "Titel", name: "titel", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
          - { label: "Bild oben", name: "bild1", widget: "object", fields: *bild }
          - { label: "Bild unten", name: "bild2", widget: "object", fields: *bild }

      - name: "unterkunft"
        label: "7 · Unterkunft & Preise"
        file: "src/content/seite/unterkunft.json"
        format: "json"
        fields:
          - { label: "Kleine Überschrift", name: "label", widget: "string" }
          - { label: "Überschrift", name: "titel", widget: "string", hint: 'Kursiv: Wörter in Sternchen setzen, z. B. Ankommen und \*Aufatmen.\*' }
          - label: "Zimmer"
            name: "zimmer"
            widget: "list"
            summary: "{{fields.name}} · {{fields.preis}} Euro"
            hint: "Der Gesamtpreis im Buchungsfenster ist Zimmerpreis plus Retreatgebühr."
            fields:
              - { label: "Name", name: "name", widget: "string", hint: "Muss genau so im Zimmer-Sheet stehen, sonst stimmt die Verfügbarkeit nicht." }
              - { label: "Preis pro Woche (Euro)", name: "preis", widget: "number", value_type: "int", min: 0 }
              - { label: "Fotos", name: "bilder", widget: "list", min: 1, field: { label: "Foto", name: "foto", widget: "image" }, hint: "Das erste Foto ist das Vorschaubild." }
              - { label: "Bildausschnitt Vorschaubild", name: "ausschnitt", widget: "string", required: false, hint: "Optional, z. B. \"center 30%\"." }
          - { label: "Retreatgebühr pro Person (Euro)", name: "retreatgebuehr", widget: "number", value_type: "int", min: 0 }
          - { label: "Text", name: "text", widget: "text" }
          - { label: "Bilder", name: "bilder", widget: "list", min: 3, max: 3, summary: "{{fields.alt}}", fields: *bild }
          - { label: "Info-Guide (PDF)", name: "infoGuide", widget: "file" }

      - name: "ueber-uns"
        label: "8 · Über uns"
        file: "src/content/seite/ueber-uns.json"
        format: "json"
        fields:
          - { label: "Kleine Überschrift", name: "label", widget: "string" }
          - { label: "Überschrift", name: "titel", widget: "string", hint: 'Kursiv: Wörter in Sternchen setzen, z. B. Ankommen und \*Aufatmen.\*' }
          - { label: "Absätze", name: "absaetze", widget: "list", field: { label: "Absatz", name: "absatz", widget: "text" } }
          - { label: "Großes Bild", name: "bild", widget: "object", fields: *bild }
          - { label: "Kleine Bilder", name: "kleineBilder", widget: "list", min: 3, max: 3, summary: "{{fields.alt}}", fields: *bild }
          - label: "Personen"
            name: "personen"
            widget: "list"
            summary: "Über {{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Text", name: "text", widget: "text", hint: "Jede neue Zeile wird ein eigener Absatz." }
              - { label: "Foto", name: "bild", widget: "object", fields: *bild }

      - name: "stimmen"
        label: "9 · Stimmen unserer Gäste"
        file: "src/content/seite/stimmen.json"
        format: "json"
        fields:
          - { label: "Kleine Überschrift", name: "label", widget: "string" }
          - { label: "Überschrift", name: "titel", widget: "string", hint: 'Kursiv: Wörter in Sternchen setzen, z. B. Ankommen und \*Aufatmen.\*' }
          - label: "Stimmen"
            name: "stimmen"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
              - { label: "Foto", name: "bild", widget: "image" }
              - { label: "Auf der Seite zeigen", name: "anzeigen", widget: "boolean", default: true, hint: "Sehr lange Stimmen machen das Karussell für alle höher." }

      - name: "galerie"
        label: "10 · Bildergalerie"
        file: "src/content/seite/galerie.json"
        format: "json"
        fields:
          - { label: "Überschrift links", name: "label", widget: "string" }
          - { label: "Überschrift rechts", name: "untertitel", widget: "string" }
          - { label: "Bilder", name: "bilder", widget: "list", min: 5, max: 5, hint: "Genau fünf Bilder. Das erste ist das große.", fields: *bild }

      - name: "buchung"
        label: "11 · Buchung"
        file: "src/content/seite/buchung.json"
        format: "json"
        fields:
          - { label: "Kleine Überschrift", name: "label", widget: "string" }
          - { label: "Überschrift", name: "titel", widget: "string", hint: 'Kursiv: Wörter in Sternchen setzen, z. B. Ankommen und \*Aufatmen.\*' }
          - { label: "Text", name: "text", widget: "text" }
          - { label: "Schritte", name: "schritte", widget: "list", field: { label: "Schritt", name: "schritt", widget: "string" } }
          - { label: "Link-Text", name: "link", widget: "string" }
          - { label: "Bild", name: "bild", widget: "object", fields: *bild }
          - { label: "Buchungsfenster: Hinweis unter den Zimmern", name: "preisHinweis", widget: "string" }
          - { label: "Buchungsfenster: Danke-Überschrift", name: "dankeTitel", widget: "string", hint: 'Kursiv: Wörter in Sternchen setzen, z. B. Ankommen und \*Aufatmen.\*' }
          - { label: "Buchungsfenster: Danke-Text", name: "dankeText", widget: "text" }
          - { label: "Buchungsfenster: Hinweis zur Anzahlung", name: "dankeHinweis", widget: "text" }
          - { label: "Anzahlungs-Link (Stripe)", name: "anzahlungLink", widget: "string" }
          - { label: "AGB (PDF)", name: "agb", widget: "file" }

      - name: "slogan"
        label: "12 · Fern von allem"
        file: "src/content/seite/slogan.json"
        format: "json"
        fields:
          - { label: "Überschrift", name: "titel", widget: "string", hint: 'Kursiv: Wörter in Sternchen setzen, z. B. Ankommen und \*Aufatmen.\*' }
          - { label: "Text", name: "text", widget: "text" }
          - { label: "Button-Text", name: "button", widget: "string" }

      - name: "faq"
        label: "13 · Häufige Fragen"
        file: "src/content/seite/faq.json"
        format: "json"
        fields:
          - { label: "Kleine Überschrift", name: "label", widget: "string" }
          - { label: "Überschrift", name: "titel", widget: "string", hint: 'Kursiv: Wörter in Sternchen setzen, z. B. Ankommen und \*Aufatmen.\*' }
          - label: "Fragen"
            name: "fragen"
            widget: "list"
            summary: "{{fields.frage}}"
            fields:
              - { label: "Frage", name: "frage", widget: "string" }
              - { label: "Antwort", name: "antwort", widget: "text" }
              - { label: "Bei Unterkunft & Preise zeigen", name: "beiPreisen", widget: "boolean", default: false, hint: "Statt unten bei den Fragen erscheint sie direkt unter den Zimmerpreisen." }

      - name: "allgemein"
        label: "Kontakt, Footer & Google"
        file: "src/content/seite/allgemein.json"
        format: "json"
        fields:
          - { label: "Seitentitel (Google und Browser-Tab)", name: "seitentitel", widget: "string" }
          - { label: "Beschreibung für Google", name: "beschreibung", widget: "text" }
          - { label: "Text beim Teilen (WhatsApp, Facebook)", name: "teilenText", widget: "string" }
          - { label: "WhatsApp-Nummer", name: "whatsapp", widget: "string", hint: "Mit Ländervorwahl, z. B. +49 152 29394860." }
          - { label: "Vorausgefüllte WhatsApp-Nachricht", name: "whatsappText", widget: "string" }
          - { label: "WhatsApp-Sprechblase", name: "whatsappHinweis", widget: "text", hint: 'Jede neue Zeile wird ein eigener Absatz. Fett: Wörter in doppelte Sternchen setzen, z. B. \*\*Namaste!\*\*' }
          - { label: "E-Mail", name: "email", widget: "string" }
          - { label: "Instagram-Link", name: "instagram", widget: "string" }
          - { label: "Text im Frage-Fenster", name: "frageText", widget: "text" }
          - { label: "Newsletter-Überschrift", name: "newsletterTitel", widget: "string", hint: 'Kursiv: Wörter in Sternchen setzen, z. B. Ankommen und \*Aufatmen.\*' }
          - { label: "Newsletter-Text", name: "newsletterText", widget: "text" }
          - { label: "Copyright-Zeile im Footer", name: "copyright", widget: "string" }
